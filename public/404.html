<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tekny Campo - Redireccionando...</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var base = '/TeknyCampo-web';
      var subpath = path.startsWith(base + '/') ? path.slice(base.length) : (path === base ? '/' : path);
      sessionStorage.setItem('redirect', subpath + window.location.search);
      window.location.replace(base + '/');
    })();
  </script>
</head>
<body></body>
</html>
